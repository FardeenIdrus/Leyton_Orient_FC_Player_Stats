<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Change password · LOFC Recruitment</title>
<style>html,body{background:#14161B}</style>
<link rel="icon" type="image/png" href="{{ static_url('img/logo.png') }}">
<link rel="stylesheet" href="{{ static_url('css/app.css') }}">
</head>
<body class="auth">
<main class="auth-wrap">
  <div class="auth-side" aria-hidden="true">
    <img src="{{ static_url('img/logo.png') }}" alt="" width="148" height="148">
    <div class="auth-club">Leyton Orient FC</div>
    <div class="auth-tag">Recruitment</div>
  </div>
  <div class="auth-card">
    <img class="auth-logo-sm" src="{{ static_url('img/logo.png') }}" alt="Leyton Orient FC" width="56" height="56">
    <h1>Set a new password</h1>
    <p class="auth-lead">{{ user.full_name }}</p>
    {% if forced %}<div class="warn">Your password was set by an administrator. Choose a new one to continue.</div>{% endif %}
    <div class="notice" id="pw-error" role="alert" hidden></div>
    <form id="pw-form">
      <div class="f"><label for="password">New password</label><input class="ctl" id="password" type="password" autocomplete="new-password" required></div>
      <div class="f"><label for="confirm">Confirm new password</label><input class="ctl" id="confirm" type="password" autocomplete="new-password" required></div>
      <button class="btn primary auth-go" type="submit">Set password</button>
    </form>
    <p class="note auth-foot"><a href="/login" id="signout">Sign out</a></p>
  </div>
</main>
<script type="module" src="{{ static_url('js/password.js') }}"></script>
<script type="module" src="{{ static_url('js/shell.js') }}"></script>
</body>
</html>
