[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lofc-recruitment"
version = "0.1.0"
description = "Leyton Orient FC Player Recruitment Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Fardeen Idrus" }]

dependencies = [
    "statsbombpy>=1.11",
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "streamlit>=1.33",
    "plotly>=5.20",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "impectPy>=2.7",
    "skillcorner>=2.2",
    "extra-streamlit-components>=0.1.71",
    # New front end (docs/frontend.md): API + page shells. Starlette, uvicorn and Jinja2 already
    # come with Streamlit; FastAPI adds no other package.
    "fastapi>=0.162",
    # Read-only access to the club's scouting sheet (Sheets API v4).
    "google-api-python-client>=2.120",
    "google-auth>=2.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
